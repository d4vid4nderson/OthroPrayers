<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A — letter spacing</title>
<style>
@font-face{font-family:"Uncial Antiqua";src:url(../../fonts/uncial-antiqua.woff2) format("woff2");font-display:block}
*{box-sizing:border-box}
body{margin:0;background:#2E3036;color:#fff;font-family:system-ui,sans-serif;padding:34px}
h2{font-size:14px;font-weight:650;letter-spacing:.05em;opacity:.85;margin:0 0 18px}
.row{display:flex;gap:34px;align-items:flex-start;margin-bottom:40px;flex-wrap:wrap}
.col{text-align:center}
.big{width:208px;height:208px;border-radius:46px;overflow:hidden;display:block}
.lab{font-size:13px;font-weight:650;margin-top:11px}
.sub{font-size:11px;opacity:.6;margin-top:3px}
.sizes{display:flex;gap:12px;justify-content:center;align-items:flex-end;margin-top:12px}
.sizes span{border-radius:22%;overflow:hidden;display:block}
svg{display:block}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <path id="patee" d="M 486 486
    Q 486 356, 450 312 Q 512 326, 574 312 Q 538 356, 538 486
    Q 668 486, 712 450 Q 698 512, 712 574 Q 668 538, 538 538
    Q 538 668, 574 712 Q 512 698, 450 712 Q 486 668, 486 538
    Q 356 538, 312 574 Q 326 512, 312 450 Q 356 486, 486 486 Z"/>
</defs></svg>
<script>
const GOLD="#D9B36C", GROUND="#0C0D10";

// dx / dyTop / dyBot are the letter pairs' distance from centre. Tightening
// means pulling all three in, so the words flank the arms instead of sitting
// out in the corners.
function iconA({dx, dyTop, dyBot, size=150, titlo=true}){
  const L = 512 - dx, R = 512 + dx;
  const bars = titlo ? `
    <g stroke="${GOLD}" stroke-width="9" stroke-linecap="round">
      <line x1="${L-88}" y1="${dyTop-104}" x2="${L+88}" y2="${dyTop-104}"/>
      <line x1="${R-88}" y1="${dyTop-104}" x2="${R+88}" y2="${dyTop-104}"/>
    </g>` : "";
  return `<svg viewBox="0 0 1024 1024" width="100%" height="100%">
    <rect width="1024" height="1024" fill="${GROUND}"/>
    <use href="#patee" fill="${GOLD}"/>
    <g fill="${GOLD}" font-family="Uncial Antiqua" font-size="${size}" text-anchor="middle">
      <text x="${L}" y="${dyTop}">IC</text><text x="${R}" y="${dyTop}">XC</text>
      <text x="${L}" y="${dyBot}">NI</text><text x="${R}" y="${dyBot}">KA</text>
    </g>${bars}
  </svg>`;
}

const VARIANTS = [
  ["As drawn",  {dx:332, dyTop:300, dyBot:800}, "what you saw — letters out in the corners"],
  ["Tighter",   {dx:258, dyTop:330, dyBot:762}, "pulled in toward the arms"],
  ["Tightest",  {dx:212, dyTop:352, dyBot:742}, "letters hugging the cross"],
  ["Tightest, no titlo", {dx:212, dyTop:352, dyBot:742, titlo:false}, "same, bars removed"],
];

let big = "", small = "";
for (const [name, cfg, note] of VARIANTS){
  big += `<div class="col">
    <span class="big">${iconA(cfg)}</span>
    <div class="lab">${name}</div><div class="sub">${note}</div>
    <div class="sizes">
      <span style="width:120px;height:120px">${iconA(cfg)}</span>
      <span style="width:76px;height:76px">${iconA(cfg)}</span>
      <span style="width:56px;height:56px">${iconA(cfg)}</span>
    </div>
  </div>`;
}
document.write(`<h2>LETTER SPACING</h2><div class="row">${big}</div>`);
</script>
</body>
</html>
