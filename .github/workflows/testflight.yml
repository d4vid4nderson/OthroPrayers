name: TestFlight

# Archive and upload to App Store Connect from a rented Mac.
#
# Deliberately manual: every run burns a build number and puts a build in front
# of testers, so it should be a decision, not a side effect of pushing.
#
# Needs three repository secrets, all obtainable from a browser:
#   ASC_KEY_ID       — App Store Connect API key ID
#   ASC_ISSUER_ID    — the issuer ID shown above the key list
#   ASC_PRIVATE_KEY  — the whole contents of the AuthKey_XXXXXXXX.p8 file,
#                      including the BEGIN/END PRIVATE KEY lines
#
# The key needs the App Manager role: it creates the distribution certificate
# and provisioning profile on the runner, which is the part usually assumed to
# require a Mac of your own.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number (blank = UTC timestamp, always increasing)"
        required: false
        default: ""

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      # The same guard the build workflow runs: never ship an app whose
      # prayers no longer match the source they were generated from.
      - name: Content model is in sync with its generators
        run: |
          python3 build.py
          python3 export_content.py
          git diff --exit-code ios/Content/ \
            || { echo "::error::ios/Content is stale"; exit 1; }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: cd ios && xcodegen generate

      # App Store Connect rejects a build number it has already seen. A UTC
      # timestamp cannot collide and always sorts forward, which a run number
      # cannot promise across workflow renames or re-runs.
      - name: Choose a build number
        id: ver
        run: |
          n="${{ inputs.build_number }}"
          [ -n "$n" ] || n="$(date -u +%y%m%d%H%M)"
          echo "build=$n" >> "$GITHUB_OUTPUT"
          echo "Uploading as build $n"

      - name: Write the API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Say which ones are missing, not just that something is. Secret
          # values can never be printed, but presence and shape can, and that
          # is enough to tell "not set" from "set to the wrong thing".
          missing=0
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            v="${!n}"
            if [ -z "$v" ]; then
              echo "::error::secret $n is not set (or is empty)"
              missing=1
            else
              echo "$n: present, ${#v} characters"
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::Add them under Settings > Secrets and variables > Actions > Repository secrets. Environment and Dependabot secrets are separate stores and are not visible here."
            exit 1
          fi
          # A .p8 that lost its newlines, or had the BEGIN/END lines stripped,
          # fails much later inside xcodebuild with an opaque message.
          case "$ASC_PRIVATE_KEY" in
            *"BEGIN PRIVATE KEY"*) ;;
            *) echo "::error::ASC_PRIVATE_KEY does not contain a BEGIN PRIVATE KEY line — paste the whole .p8 file, including its first and last lines"; exit 1 ;;
          esac
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "wrote AuthKey_${ASC_KEY_ID}.p8 ($(wc -l < ~/private_keys/AuthKey_${ASC_KEY_ID}.p8) lines)"

      # Manual signing. Automatic signing cannot work here: this account's API
      # key is refused by the Developer portal — /v1/certificates, /v1/bundleIds
      # and /v1/profiles all answer 403 "Unable to find a team with the given
      # Content Provider ID to which you belong" — so Xcode can never obtain a
      # distribution identity on its own. The certificate and profile are made
      # by hand in the browser instead and handed to the runner.
      #
      # Uploading still uses the API key, because App Store Connect accepts it
      # happily; it was only the portal that did not.
      - name: Install the signing identity
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PROFILE: ${{ secrets.SIGNING_PROFILE }}
        run: |
          for n in SIGNING_KEY SIGNING_PROFILE; do
            [ -n "${!n}" ] || { echo "::error::secret $n is not set"; exit 1; }
          done
          d="$RUNNER_TEMP/signing"; mkdir -p "$d"

          printf '%s\n' "$SIGNING_KEY" > "$d/key.pem"
          echo "$SIGNING_PROFILE" | base64 --decode > "$d/profile.mobileprovision"

          # The profile already carries the signing certificate, so there is no
          # separate secret for it: one artifact, one source of truth, and no
          # way for a certificate and a profile to be uploaded out of step with
          # each other.
          security cms -D -i "$d/profile.mobileprovision" > "$d/profile.plist"
          plutil -extract DeveloperCertificates.0 raw -o - "$d/profile.plist" \
            | base64 --decode > "$d/cert.cer"
          # Apple's certificate is DER; openssl wants PEM to pair it with the key.
          openssl x509 -inform DER -in "$d/cert.cer" -out "$d/cert.pem"
          echo "certificate: $(openssl x509 -in "$d/cert.pem" -noout -subject -enddate)"

          # The key and the certificate must actually be a pair. If they are
          # not, codesign fails much later with a far vaguer message.
          kmod="$(openssl rsa  -in "$d/key.pem"  -noout -modulus | openssl md5)"
          cmod="$(openssl x509 -in "$d/cert.pem" -noout -modulus | openssl md5)"
          [ "$kmod" = "$cmod" ] || { echo "::error::the certificate does not match the private key"; exit 1; }
          echo "key and certificate match"

          pw="$(uuidgen)"
          openssl pkcs12 -export -legacy \
            -inkey "$d/key.pem" -in "$d/cert.pem" \
            -out "$d/identity.p12" -passout "pass:$pw" \
            || openssl pkcs12 -export \
                 -inkey "$d/key.pem" -in "$d/cert.pem" \
                 -out "$d/identity.p12" -passout "pass:$pw"

          # A throwaway keychain, so nothing touches the runner's login one.
          kc="$RUNNER_TEMP/build.keychain"; kcpw="$(uuidgen)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$d/identity.p12" -k "$kc" -P "$pw" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt that no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

          echo "--- identities now available ---"
          security find-identity -v -p codesigning "$kc"

          # Profiles are looked up by UUID on disk, but referenced by name in
          # the build, so both are read straight out of the profile itself
          # rather than typed in twice.
          uuid="$(plutil -extract UUID raw -o - "$d/profile.plist")"
          name="$(plutil -extract Name raw -o - "$d/profile.plist")"
          dest="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dest"
          cp "$d/profile.mobileprovision" "$dest/$uuid.mobileprovision"
          echo "profile: $name ($uuid)"

          # The certificate and profile expire, and renewing them is a manual
          # trip through the browser because this account's API key cannot
          # reach the portal (see NATIVE.md). Nothing else would announce that
          # until an upload failed, so it is announced here, early.
          exp="$(plutil -extract ExpirationDate raw -o - "$d/profile.plist")"
          echo "expires: $exp"
          left=$(( ( $(date -j -f "%Y-%m-%dT%H:%M:%SZ" "$exp" +%s 2>/dev/null \
                       || date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
          echo "days remaining: $left"
          if [ "$left" -lt 0 ]; then
            echo "::error::the provisioning profile expired $(( -left )) days ago — see NATIVE.md to renew"
            exit 1
          elif [ "$left" -lt 30 ]; then
            echo "::warning::the provisioning profile expires in $left days — renewing is manual, see NATIVE.md"
          fi

          echo "PROFILE_NAME=$name" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$kc"       >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd ios
          set -o pipefail
          # Manual signing throughout: no -allowProvisioningUpdates, because
          # there is nothing for it to update — the portal refuses this key.
          # Everything it would have fetched is already installed.
          xcodebuild archive \
            -project Prayers.xcodeproj \
            -scheme Prayers \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Prayers.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            | tee "$RUNNER_TEMP/archive.log"

      - name: Export and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # teamID is read from project.yml so there is one source of truth
          team="$(grep -E '^[[:space:]]*DEVELOPMENT_TEAM:' ios/project.yml \
                  | head -1 | sed -E 's/.*DEVELOPMENT_TEAM:[[:space:]]*([A-Z0-9]+).*/\1/')"
          echo "team: $team"
          bundle="$(grep -E '^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER:' ios/project.yml | head -1 | sed -E 's/.*:[[:space:]]*//')"
          # signingStyle manual, and the profile named per bundle id: with
          # automatic here, export would go back to the portal that refuses
          # this key and undo the whole point of signing by hand.
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${team}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${bundle}</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          echo "--- export options ---"; cat "$RUNNER_TEMP/export.plist"
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Prayers.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log"

      # Uploading is not arriving.
      #
      # `-exportArchive ... destination upload` reports success once Apple
      # accepts the bytes for delivery. Processing happens afterwards, on
      # their side, and a build that fails it never reaches TestFlight while
      # this workflow stays green — the only notice is an email to the
      # account owner. That is the exact shape of a passing pipeline and an
      # empty TestFlight, and it is worth one more minute to rule out.
      - name: App Store Connect actually has the build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 .github/asc_probe.py \
            "$ASC_KEY_ID" "$ASC_ISSUER_ID" \
            ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            --await "${{ steps.ver.outputs.build }}"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore

      - name: Always remove the key
        if: always()
        run: rm -rf ~/private_keys
