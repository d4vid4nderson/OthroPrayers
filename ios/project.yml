# XcodeGen spec. Generating the project beats hand-writing project.pbxproj:
# the pbxproj format is long, order-sensitive and merges badly, and this file
# is reviewable.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open Prayers.xcodeproj
#
name: Prayers

# The 160 alternate app icons, generated alongside their PNGs by
# tools_build_icons.py so the declarations and the files cannot drift apart.
# It is long and mechanical, which is exactly why it is not in this file.
include:
  - alticons.yml

options:
  bundleIdPrefix: com.orthoprayers
  deploymentTarget:
    # 26.0, not 27.0. An app cannot target an SDK newer than the one building
    # it, and the newest Xcode on GitHub's macOS runners is 26.6 (iOS SDK
    # 26.5). Targeting 27.0 there is only a warning for a simulator build but
    # cannot produce a valid archive, which is what TestFlight needs.
    # Raise this once the runners ship Xcode 27.
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: RN599658F9   # David Anderson — the paid team;
                                   # "personal team" was a misnomer, and sent
                                   # me looking for a signing bug that was not
                                   # there
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal   # tighten once it builds clean

targets:
  Prayers:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # groups, not folder references: the fonts, the privacy manifest and the
      # JSON must land at the bundle root, where UIAppFonts and Bundle.main
      # look for them. A folder reference would bury them a level down.
      #
      # App/Resources/AltIcons and App/Resources/Art ride on this. A group is
      # flattened on the way into the bundle, which is what CFBundleIconFiles
      # needs — it looks for its PNGs at the root and nowhere else — and what
      # lets UIImage(named:) find the ornaments by bare name.
      - path: App/Resources
      # the generated content model, referenced where build.py writes it and
      # never copied, so the app cannot drift from the site
      - path: Content
      # the monastery recordings, as a folder reference so they arrive in the
      # bundle under Music/ rather than as 19 loose files at its root.
      # The audio is gitignored but the directory is kept (ios/Music/.gitkeep):
      # `optional` only silences XcodeGen, which still writes the reference, so
      # a missing directory fails the copy phase and the whole build.
      - path: Music
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Prayers
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # no encryption beyond what iOS itself provides: this stops App Store
        # Connect asking about export compliance on every single upload
        ITSAppUsesNonExemptEncryption: false
        # chant should not stop when the screen does
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - OpenDyslexic-Regular.ttf
          - OpenDyslexic-Bold.ttf
          - OpenDyslexic-Italic.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
          - JetBrainsMono-Italic.ttf
          - UncialAntiqua-Regular.ttf
          - IMFellEnglishSC-Regular.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.orthoprayers.western
            CFBundleURLSchemes: [prayers]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orthoprayers.western
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The alternates are declared in Info.plist (see alticons.yml), not
        # here. An asset-catalog appiconset holds one 1024px image, which is
        # what the App Store listing wants and roughly eight times what a
        # home screen ever draws; at 160 icons that was about 40MB of detail
        # no one would ever see. Loose 120 and 180px files cost 6MB for the
        # whole set, and double as the picker's thumbnails.
        #
        # AppIcon stays in the catalogue: it is the default, so it is the one
        # the listing is cut from, and the only one that can carry separate
        # light, dark and tinted appearances.
        # iPhone only. The design is portrait and dark by construction, and
        # App Store validation requires an iPad-capable build to offer all four
        # orientations for multitasking — which would mean shipping a layout
        # nobody drew. Set this to "1,2" only alongside a real iPad layout.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  PrayersUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: Prayers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orthoprayers.western.uitests
        TEST_TARGET_NAME: Prayers
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Prayers:
    build:
      targets:
        Prayers: all
        PrayersUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrayersUITests
    # explicit, so a TestFlight build cannot quietly become a Debug one
    archive:
      config: Release
