# XcodeGen spec. Generating the project beats hand-writing project.pbxproj:
# the pbxproj format is long, order-sensitive and merges badly, and this file
# is reviewable.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open Prayers.xcodeproj
#
name: Prayers
options:
  bundleIdPrefix: com.orthoprayers
  deploymentTarget:
    iOS: "27.0"          # iOS 27: second-iteration Liquid Glass, .crossFade
                         # navigation. Drop to 26.0 to reach last year's phones
                         # (then the crossFade call needs an #available gate).
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: RN599658F9   # David Anderson (personal team)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal   # tighten once it builds clean

targets:
  Prayers:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # groups, not folder references: the fonts, the privacy manifest and the
      # JSON must land at the bundle root, where UIAppFonts and Bundle.main
      # look for them. A folder reference would bury them a level down.
      - path: App/Resources
      # the generated content model, referenced where build.py writes it and
      # never copied, so the app cannot drift from the site
      - path: Content
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Prayers
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        # no encryption beyond what iOS itself provides: this stops App Store
        # Connect asking about export compliance on every single upload
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - OpenDyslexic-Regular.ttf
          - OpenDyslexic-Bold.ttf
          - OpenDyslexic-Italic.ttf
        CFBundleURLTypes:
          - CFBundleURLName: com.orthoprayers.western
            CFBundleURLSchemes: [prayers]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orthoprayers.western
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only. The design is portrait and dark by construction, and
        # App Store validation requires an iPad-capable build to offer all four
        # orientations for multitasking — which would mean shipping a layout
        # nobody drew. Set this to "1,2" only alongside a real iPad layout.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  PrayersUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: Prayers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orthoprayers.western.uitests
        TEST_TARGET_NAME: Prayers
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Prayers:
    build:
      targets:
        Prayers: all
        PrayersUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PrayersUITests
